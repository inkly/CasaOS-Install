name: release

# Cuts an installer release from components that have already been released
# by their own repositories. Nothing is compiled here: the six component
# checkouts only contribute their setup scripts to the compatibility overlay,
# and every binary digest the installer verifies is fetched from the
# component's own checksums.txt, or computed from the published tarball for
# the two releases that have none (the dashboard and the App Store). The App
# Store seed is mirrored from IceWhale's release into our own, so a new install
# depends only on assets we publish.
#
# Order of operations for a release, all under the same GitHub account:
#   1. tag and release each component (CasaOS, CasaOS-AppManagement,
#      CasaOS-Gateway, CasaOS-UserService, CasaOS-MessageBus,
#      CasaOS-LocalStorage, CasaOS-UI) and wait for their assets to exist
#   2. pin their tags and commits in release/components.env, commit
#   3. tag this repository with CASAOS_RELEASE_TAG - this workflow runs

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Assemble and publish the installer
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Load component pins
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' release/components.env >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            expected="$(grep '^CASAOS_RELEASE_TAG=' release/components.env | cut -d= -f2)"
            if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CASAOS_RELEASE_TAG=${expected} in components.env" >&2
              exit 1
            fi
          fi

      - name: Checkout CasaOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS
          ref: ${{ env.CASAOS_COMMIT }}
          path: work/CasaOS

      - name: Checkout CasaOS-Gateway
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-Gateway
          ref: ${{ env.CASAOS_GATEWAY_COMMIT }}
          path: work/CasaOS-Gateway

      - name: Checkout CasaOS-UserService
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-UserService
          ref: ${{ env.CASAOS_USER_SERVICE_COMMIT }}
          path: work/CasaOS-UserService

      - name: Checkout CasaOS-LocalStorage
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-LocalStorage
          ref: ${{ env.CASAOS_LOCAL_STORAGE_COMMIT }}
          path: work/CasaOS-LocalStorage

      - name: Checkout CasaOS-MessageBus
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-MessageBus
          ref: ${{ env.CASAOS_MESSAGE_BUS_COMMIT }}
          path: work/CasaOS-MessageBus

      - name: Checkout CasaOS-AppManagement
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CasaOS-AppManagement
          ref: ${{ env.CASAOS_APP_MANAGEMENT_COMMIT }}
          path: work/CasaOS-AppManagement

      - name: Assemble the release bundle
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}/work
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: scripts/build-release-bundle.sh dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/casaos-uninstall
            dist/linux-zz-casaos-compat-overlay-*.tar.gz
            dist/linux-all-appstore-*.tar.gz
            dist/version.json
            dist/components.lock
            dist/checksums.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  # Install what was just published, on a fresh machine, and use it.
  #
  # Every release before this one was cut without anybody running install.sh
  # from the published bundle: the digests were checked against the component
  # releases, and that was all. This job is the missing half. It runs the
  # installer exactly as the README says to, on the runner itself (a full VM
  # with systemd, which a container is not), then drives the box through the
  # first-boot path a person would take: services up, dashboard answering,
  # first user, an app installed, a backup of it made through rclone and found
  # on disk. Red here does not unpublish anything -- the assets are already
  # out -- but it is the alarm, and it fires within the hour of the tag.
  install-check:
    name: Install the published bundle and use it
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Fetch the published installer
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            -p install.sh -p install.sh.sha256 -p components.lock
          sha256sum --check install.sh.sha256
          grep -E '^(CASAOS_RELEASE_TAG|RCLONE_TAG|CASAOS_UI_TAG)=' components.lock >> "$GITHUB_ENV"

      - name: Run the installer as the README says
        run: |
          set -euo pipefail
          sudo -E bash install.sh 2>&1 | tee install.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Every service is up, and it is this release
        run: |
          set -euo pipefail
          for unit in casaos-gateway casaos-message-bus casaos-user-service casaos-local-storage casaos-app-management rclone casaos; do
            state="$(systemctl is-active "${unit}.service" || true)"
            echo "${unit}: ${state}"
            test "${state}" = active
          done
          marker="$(cat /var/lib/casaos/fork-release)"
          echo "fork-release marker: ${marker}"
          test "${marker}" = "${CASAOS_RELEASE_TAG}"
          version="$(rclone --version | head -n 1)"
          echo "rclone: ${version}"
          test "${version}" = "rclone ${RCLONE_TAG}"
          test -S /var/run/rclone/rclone.sock

      - name: The dashboard answers
        run: |
          set -euo pipefail
          port="$(awk '/HttpPort/ { print $3 }' /etc/casaos/gateway.ini)"
          echo "gateway port: ${port}"
          echo "CASA_URL=http://127.0.0.1:${port}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/" || true)"
            [ "${code}" = 200 ] && break
            sleep 2
          done
          test "${code}" = 200

      - name: First user, then a token
        run: |
          set -euo pipefail
          key="$(curl -fsS "${CASA_URL}/v1/users/status" | jq -r '.data.key')"
          test -n "${key}" && test "${key}" != null
          curl -fsS -X POST "${CASA_URL}/v1/users/register" -H 'content-type: application/json' \
            -d "{\"username\":\"smoke\",\"password\":\"Smoke-test-1\",\"key\":\"${key}\"}" >/dev/null
          token="$(curl -fsS -X POST "${CASA_URL}/v1/users/login" -H 'content-type: application/json' \
            -d '{"username":"smoke","password":"Smoke-test-1"}' | jq -r '.data.token.access_token')"
          test -n "${token}" && test "${token}" != null
          echo "::add-mask::${token}"
          echo "CASA_TOKEN=${token}" >> "$GITHUB_ENV"

      # A destination is an rclone remote. `alias` onto a directory keeps the
      # test on this machine while going through exactly the same daemon, the
      # same socket and the same rc calls an S3 bucket would.
      - name: A backup destination, and the daemon answers for it
        run: |
          set -euo pipefail
          sudo mkdir -p /var/tmp/casaos-backup-smoke
          curl -fsS -X PUT "${CASA_URL}/v2/app_management/backup/destinations/smoke" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"backend":"alias","parameters":{"remote":"/var/tmp/casaos-backup-smoke"}}' | jq .
          curl -fsS -X POST "${CASA_URL}/v2/app_management/backup/destinations/smoke/check" \
            -H "Authorization: ${CASA_TOKEN}" | jq .

      - name: An app, from a compose file
        run: |
          set -euo pipefail
          sudo mkdir -p /DATA/AppData/smoke/html
          echo "hello from ${CASAOS_RELEASE_TAG}" | sudo tee /DATA/AppData/smoke/html/index.html >/dev/null
          cat > smoke.yml <<'YAML'
          name: smoke
          services:
            web:
              image: nginx:alpine
              container_name: smoke
              volumes:
                - /DATA/AppData/smoke/html:/usr/share/nginx/html:ro
          x-casaos:
            main: web
            title:
              en_us: Smoke
          YAML
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/yaml' \
            --data-binary @smoke.yml | jq .
          for _ in $(seq 1 60); do
            docker ps --format '{{.Names}} {{.Status}}' | grep -q '^smoke Up' && break
            sleep 3
          done
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'

      - name: A backup of it, through rclone, found on disk
        run: |
          set -euo pipefail
          curl -fsS -X POST "${CASA_URL}/v2/app_management/compose/smoke/backup" \
            -H "Authorization: ${CASA_TOKEN}" -H 'content-type: application/json' \
            -d '{"destination":"smoke","hold_still":true}' | jq .
          for _ in $(seq 1 40); do
            run="$(curl -fsS "${CASA_URL}/v2/app_management/backup/runs" -H "Authorization: ${CASA_TOKEN}" \
              | jq -c '.data // [] | map(select(.app == "smoke")) | first // empty')"
            [ -n "${run}" ] && [ "$(jq -r '.finished_at' <<<"${run}")" != "0001-01-01T00:00:00Z" ] && break
            sleep 3
          done
          echo "run: ${run}"
          test -n "${run}"
          test "$(jq -r '.error // ""' <<<"${run}")" = ""
          test "$(jq -r '.containers_stopped' <<<"${run}")" = true
          sudo find /var/tmp/casaos-backup-smoke -type f | tee backup-files.txt
          grep -q 'index.html$' backup-files.txt
          grep -q 'manifest' backup-files.txt
          # the app came back after being held still for the copy
          docker ps --format '{{.Names}} {{.Status}}' | grep '^smoke Up'

      - name: Keep the installer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-check-${{ github.ref_name }}
          path: |
            install.log
            backup-files.txt
          if-no-files-found: ignore
